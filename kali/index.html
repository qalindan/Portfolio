<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Userform</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="form-container">
        <h2>registration form</h2>
        <form id="registrationform" action="#" method="post">
            <div class="form-group">
                <label for="firstname">First name:</label>
                <input type="text" id="firstname" name="firstname"required>
            </div>
            <div class="form-group">
                <label for="lastname">Last name:</label>
                <input type="text"id="lastname" name="lastname"required>

            </div>
            <div class="form-group">
                <label for="email">email:</label>
                <input type="email" id="email" name="email"required>
            </div>
            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" name="password"required>

            </div>
            <div class="form-group">
                <label for="confirmpassword">Confirmpassword:</label>
                <input type="password" id="confirmpassword" name="confirmpassword"required>
            </div>
            <div class="gender-options">
                <label>Gender:</label>
                <label for="male"><input type="radio" id="male" name="gender" value="male" required> Male</label>
                <label for="female"><input type="radio" id="female" name="gender" value="female" required> Female</label>
            </div>
            <div class="form-group">
                <label for="department">department:</label>
                <select id="department" name="department" required>
                    <option value="">select department</option>
                    <option value="CSE">computer science</option>
                    <option value="SE">software</option>
                    <option value="ECE">communication</option>
                    <option value="Power">power and control</option>
                </select>
            </div>
            <div>
                <input type="submit" value="submit">
             
            </div>
        </form> 
    
    </div>
    <script src="script.js"></script> 
</body>
</html>
